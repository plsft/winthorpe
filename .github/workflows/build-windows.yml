name: Build (Windows)

# Compile-only verification on every PR + push to main. Catches Windows
# regressions before they get into a release build. The publish workflow
# in publish-windows.yml does the actual artifact production on tag push.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sidecar deps (typecheck dependency)
        working-directory: sidecar
        run: bun install --frozen-lockfile

      - name: Cargo check
        working-directory: src-tauri
        env:
          # CI runners don't ship sccache; the project default sets it as
          # the rustc-wrapper, so override to none.
          CARGO_BUILD_RUSTC_WRAPPER: ""
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

      - name: Sidecar typecheck
        working-directory: sidecar
        run: bunx tsc --noEmit
