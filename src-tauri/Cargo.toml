[package]
name = "winthorpe"
version = "0.6.2"
description = "The local-first Windows IDE for AI coding sessions."
authors = ["Caspian Zhao", "Nathan Lian"]
edition = "2021"
default-run = "winthorpe"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winthorpe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.10.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "test", "devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-mcp-bridge = "0.11.0"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
notify = "7"
notify-debouncer-full = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "chrono"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

# libc still ships on every target — Unix uses it for signals/process groups,
# Windows now goes through windows-rs Job Objects (see target-specific deps
# below) so libc on Windows is unused but harmless.
[dependencies.libc]
version = "0.2"

# `portable-pty` abstracts ConPTY on Windows and POSIX PTYs on Unix behind
# a single API. It's the maintainer's established choice (Kismet uses 0.8).
# `arboard` is the cross-platform clipboard backend that replaces macOS-only
# osascript in Phase 5; Phase 1 doesn't use it yet but pulling it now keeps
# Cargo.lock stable across phases.
[dependencies.portable-pty]
version = "0.8"

[dependencies.arboard]
version = "3"
default-features = false
features = ["wayland-data-control"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"

# Windows-only deps:
#   - `windows` for Job Objects (Phase 2), DPAPI (Phase 4), Registry walk
#     (Phase 5), shell PATH update (Phase 7). One crate, feature-gated.
#   - `winreg` is the high-level wrapper around HKEY operations the registry
#     editor uses — easier than raw windows-rs for nested key walks.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[[bin]]
name = "winthorpe-cli"
path = "src/bin/winthorpe-cli.rs"

[[bin]]
name = "gen_pipeline_fixture"
path = "src/bin/gen_pipeline_fixture.rs"

[dev-dependencies]
insta = { version = "1", features = ["yaml", "glob"] }
tempfile = "3"

# ---------------------------------------------------------------------------
# Dev profile: optimised for fastest compilation, not runtime performance.
# sccache is the cross-worktree cache; incremental is disabled because the
# two are mutually exclusive.
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"   # keep backtraces, skip 80% of debug info
split-debuginfo = "unpacked" # skip dsymutil merge (macOS default, explicit)
opt-level = 0
codegen-units = 256          # max intra-crate parallelism
incremental = false          # required for sccache compatibility

[profile.dev.package."*"]
debug = false                # deps don't need debug info at all
opt-level = 0
codegen-units = 256

[profile.dev.build-override]
debug = false                # build scripts & proc-macros: fastest possible
opt-level = 0
codegen-units = 256

# Release profile — performance is a stated headline feature for Winthorpe.
# Trade ~3x build time for measurably better runtime (PTY throughput,
# event-loop latency, Job Object teardown). lto=thin keeps the gain without
# the full-LTO pause; codegen-units=1 lets the optimizer see the whole crate
# in one pass.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"           # smaller exe, no stack symbol loss
panic = "abort"               # smaller + faster; exec spawn paths catch the rest

[profile.release.package."*"]
opt-level = 3

# Tagged-release profile. Inherits from `release` but flips `lto` from "thin"
# to "fat" — typically 5–10% smaller binary and 3–5% faster steady-state at
# the cost of 2–3× longer wall-clock build time. Used by
# `bun run release:win` for shipping NSIS artifacts; everyday
# `cargo build --release` keeps the faster `release` profile so iteration
# stays cheap.
[profile.release-fat]
inherits = "release"
lto = "fat"
